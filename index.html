<style>
/* ============================================================
   DEUKSIL — Design system v2
   ============================================================ */
:root{
  --ink:#101B26; --ink-2:#3A4A59; --muted:#748496;
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4; --surface-3:#E3E9EE;
  --line:#E1E7EC; --line-strong:#C7D2DB;
  --brand:#0F3057; --brand-2:#0A2342; --brand-soft:#E7EDF4; --brand-ink:#FFFFFF;
  --gold:#B4863F; --gold-soft:#F6EEDD;
  --ok:#2E7D53; --ok-soft:#E5F1E9;
  --warn:#96690F; --warn-soft:#F7EEDA;
  --bad:#A93B2E; --bad-soft:#F8E7E4;
  --info:#2E5F94; --info-soft:#E6EDF6;
  --nav:#0A2138; --nav-2:#123659; --nav-text:#B7C4D3; --nav-line:#1C3F62;
  --r-btn:10px; --r-card:16px; --r-lg:24px;
  --sh-1:0 1px 2px rgba(16,27,38,.05);
  --sh-2:0 1px 3px rgba(16,27,38,.06), 0 12px 28px -18px rgba(16,27,38,.30);
  --sh-3:0 24px 60px -32px rgba(16,27,38,.40);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --sidebar:250px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E7ECF1; --ink-2:#BFCAD6; --muted:#8996A6;
  --bg:#070D14; --surface:#0E1620; --surface-2:#131D29; --surface-3:#1A2632;
  --line:#1E2A37; --line-strong:#2C3B4A;
  --brand:#4E7FB8; --brand-2:#3E6796; --brand-soft:#132234; --brand-ink:#06111C;
  --gold:#D8B569; --gold-soft:#26200E;
  --ok:#5CBE8A; --ok-soft:#122A1C;
  --warn:#DCAF52; --warn-soft:#28210F;
  --bad:#E2887A; --bad-soft:#2C1712;
  --info:#7EA9DD; --info-soft:#121F30;
  --sh-2:0 1px 3px rgba(0,0,0,.5), 0 14px 32px -20px rgba(0,0,0,.9);
  --sh-3:0 26px 64px -34px rgba(0,0,0,.95);
}}
:root[data-theme="dark"]{
  --ink:#E7ECF1; --ink-2:#BFCAD6; --muted:#8996A6;
  --bg:#070D14; --surface:#0E1620; --surface-2:#131D29; --surface-3:#1A2632;
  --line:#1E2A37; --line-strong:#2C3B4A;
  --brand:#4E7FB8; --brand-2:#3E6796; --brand-soft:#132234; --brand-ink:#06111C;
  --gold:#D8B569; --gold-soft:#26200E;
  --ok:#5CBE8A; --ok-soft:#122A1C;
  --warn:#DCAF52; --warn-soft:#28210F;
  --bad:#E2887A; --bad-soft:#2C1712;
  --info:#7EA9DD; --info-soft:#121F30;
  --sh-2:0 1px 3px rgba(0,0,0,.5), 0 14px 32px -20px rgba(0,0,0,.9);
  --sh-3:0 26px 64px -34px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.12;font-weight:600}
h1,h2{font-family:var(--display);letter-spacing:-.012em;font-weight:600}
h3,h4{font-family:var(--sans);letter-spacing:-.005em;font-weight:600}
h1{font-size:clamp(2.4rem,5.4vw,4rem)} h2{font-size:clamp(1.6rem,3.2vw,2.4rem)} h3{font-size:1.02rem} h4{font-size:.94rem}
p{margin:0 0 1rem} a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
.wrap{width:min(1200px,92vw);margin-inline:auto}
.muted{color:var(--muted)}
.small{font-size:.82rem;line-height:1.5}
.row{display:flex;gap:12px;align-items:center}
.row-between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:18px}
.hidden{display:none !important}
.ic{flex:none;vertical-align:-.2em}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 17px;border-radius:var(--r-btn);border:1px solid transparent;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:.89rem;cursor:pointer;text-decoration:none;box-shadow:var(--sh-1);transition:background .15s,box-shadow .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--brand-2);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.soft{background:var(--brand-soft);color:var(--brand);box-shadow:none}
.btn.soft:hover{background:var(--brand-soft);border-color:var(--brand)}
.btn.gold{background:var(--gold);color:#1B1304}
.btn.gold:hover{background:#8F6314}
.btn.danger{background:var(--bad)} .btn.danger:hover{background:#8C2A20}
.btn.sm{padding:6px 12px;font-size:.8rem;gap:5px}
.btn.lg{padding:13px 24px;font-size:.97rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:22px;box-shadow:var(--sh-1)}
.card.pad-s{padding:14px;border-radius:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:.8rem;font-weight:600;border:1px solid transparent}
.chip button{background:rgba(0,0,0,.08);border:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:inherit}
.chip button:hover{background:rgba(0,0,0,.16)}
.check.small{font-size:.78rem;color:var(--muted);gap:6px}
.compare-bar{position:sticky;bottom:14px;margin-top:18px;background:var(--nav);color:#fff;border-radius:var(--r-card);padding:12px 16px;box-shadow:var(--sh-3);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.compare-bar .badge{background:rgba(255,255,255,.14);color:#fff;gap:8px}
.compare-bar .badge button{background:rgba(255,255,255,.18);border:0;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);box-shadow:var(--sh-1)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.87rem}
th{text-align:left;font-weight:600;color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.78rem;background:var(--surface-2)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.8rem;flex:none;letter-spacing:.01em}
.empty{padding:52px 24px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.empty b{color:var(--ink);font-size:1.02rem}

/* ---------- Formulaires ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line-strong);border-radius:var(--r-btn);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:110px;resize:vertical}
.form-grid{display:grid;gap:0 18px;grid-template-columns:1fr 1fr}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice label{flex:1 1 150px;border:1px solid var(--line-strong);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--surface);transition:border-color .15s,background .15s}
.choice input{margin-top:3px;accent-color:var(--brand)}
.choice label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem}
.check input{accent-color:var(--brand);width:15px;height:15px}
.err{color:var(--bad);font-size:.82rem;margin:-4px 0 12px}
.form-err-box:empty{display:none}
.form-err-box .err{margin:0 0 14px;padding:10px 12px;background:var(--bad-soft);border-radius:9px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-toggle{position:absolute;right:4px;top:0;bottom:0;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 9px;display:grid;place-items:center}
.pw-toggle:hover{color:var(--ink)}
.upload-zone{border:1.5px dashed var(--line-strong);border-radius:var(--r-card);padding:16px;background:var(--surface-2)}
.upload-btn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 12px;border-radius:12px;cursor:pointer;color:var(--ink-2);transition:background .15s}
.upload-btn:hover{background:var(--surface-3)}
.upload-btn input{display:none}
.upload-btn span:first-of-type{font-weight:600;color:var(--ink)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-3)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .cover-tag{position:absolute;left:5px;bottom:5px;font-style:normal;font-size:.62rem;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:2px 6px;border-radius:5px}
.photo-thumb .rm{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(20,16,12,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.photo-thumb .rm:hover{background:var(--bad)}

/* ---------- Toasts / modales ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:90;max-width:min(360px,90vw)}
.toast{background:var(--nav);color:#EAF2EE;border-radius:12px;padding:13px 15px;box-shadow:var(--sh-3);font-size:.87rem;animation:slide .22s cubic-bezier(.2,.8,.3,1)}
.toast .ic{color:var(--ok)} .toast.bad .ic{color:#F0958B} .toast.warn .ic{color:#E8C069}
@keyframes slide{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:rgba(6,16,12,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:80;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--sh-3);border:1px solid var(--line)}
.modal-head{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h3{font-size:1.15rem}
.modal-body{padding:14px 24px 24px}
.x{background:var(--surface-2);border:0;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.x:hover{background:var(--surface-3);color:var(--ink)}
.pd-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.pd-topbar b{font-family:var(--display);font-size:1.05rem;color:#E8720C}
.pd-merchant{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.pd-merchant code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:.78rem}
.pd-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pd-method{border:1px solid var(--line-strong);border-radius:11px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.pd-method.on{border-color:#E8720C;background:color-mix(in srgb, #E8720C 8%, var(--surface))}
.pd-method:disabled{opacity:.6;cursor:not-allowed}

/* ---------- Landing ---------- */
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0}
.logo{font-family:var(--display);font-weight:600;font-size:1.32rem;letter-spacing:-.015em;display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mark{width:30px;height:30px;object-fit:contain;flex:none;display:block}
.nav-links{display:flex;gap:26px;font-size:.89rem;font-weight:500}
.nav-links a{text-decoration:none;color:var(--ink-2)}
.nav-links a:hover{color:var(--brand)}
.hero{padding:76px 0 64px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% 40% 40% -20%;background:radial-gradient(closest-side,var(--brand-soft),transparent);opacity:.9;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:52px;align-items:center;position:relative}
.hero h1{max-width:13ch}
.hero .lede{font-size:1.08rem;color:var(--ink-2);max-width:48ch;margin-top:18px}
.searchbar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;box-shadow:var(--sh-2);margin-top:28px}
.searchbar select{border:1px solid transparent;background:var(--surface-2);font-weight:500}
.hero-card{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-3);position:relative}
.hero-chip{position:absolute;left:18px;bottom:112px;background:var(--surface);border-radius:12px;padding:9px 13px;box-shadow:var(--sh-2);font-size:.8rem;font-weight:600;display:flex;gap:8px;align-items:center}
.section{padding:72px 0;border-top:1px solid var(--line)}
.kicker{color:var(--gold);font-weight:700;font-size:.82rem;margin-bottom:10px}
.stat-band{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.stat-band .n{font-family:var(--display);font-size:2.6rem;font-weight:600;letter-spacing:-.012em;line-height:1}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand);font-size:1.25rem;line-height:1}
.faq details[open] summary::after{content:"–"}
footer.site{background:var(--nav);color:var(--nav-text);padding:58px 0 28px}
footer.site a{color:var(--nav-text);text-decoration:none;font-size:.88rem;opacity:.85}
footer.site a:hover{opacity:1}

/* ---------- Visuels de biens ---------- */
.photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-3);display:block}
.photo svg.scene,.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .tag{position:absolute;left:12px;top:12px;font-size:.72rem;background:rgba(255,255,255,.93);color:#0B1A15;padding:4px 10px;border-radius:8px;font-weight:700;backdrop-filter:blur(6px)}
.photo .fav{position:absolute;right:12px;top:12px;border:0;background:rgba(255,255,255,.93);color:#0B1A15;width:32px;height:32px;border-radius:10px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .12s}
.photo .fav:hover{transform:scale(1.07)}
.photo .fav.on{background:var(--bad);color:#fff}

.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(286px,1fr));gap:22px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-1);transition:box-shadow .18s,transform .18s}
.prop:hover{box-shadow:var(--sh-2)}
.prop .body{padding:16px 17px 17px;display:flex;flex-direction:column;gap:9px;flex:1}
.prop .price{font-family:var(--display);font-size:1.32rem;font-weight:600;letter-spacing:-.008em}
.prop .feat{display:flex;gap:8px;font-size:.78rem;color:var(--ink-2);flex-wrap:wrap}
.prop .feat span{background:var(--surface-2);padding:3px 9px;border-radius:7px}
.prop h3{font-size:1rem;line-height:1.3}
.prop .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- Coquille applicative ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.side{background:var(--nav);color:var(--nav-text);padding:20px 14px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{color:#fff;padding:4px 8px 22px}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--nav-text);font-size:.875rem;font-weight:500;transition:background .14s,color .14s}
.side a:hover{background:var(--nav-2);color:#fff}
.side a.active{background:var(--nav-2);color:#fff;box-shadow:inset 2px 0 0 var(--gold)}
.side .ico{display:inline-flex;opacity:.62}
.side a.active .ico,.side a:hover .ico{opacity:1}
.side-user{background:var(--nav-2);border-radius:12px;padding:12px}
.side-user .btn{background:transparent;border:1px solid var(--nav-line);color:var(--nav-text);box-shadow:none}
.side-user .btn:hover{background:#1B342A;color:#fff}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 30px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
.crumb{font-size:.82rem;color:var(--muted);font-weight:500}
.burger{display:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:6px 9px;cursor:pointer}
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -16px rgba(16,27,38,.25)}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--muted);
    background:none;border:0;font-size:.66rem;font-weight:600;font-family:var(--sans);cursor:pointer}
  .tab-item.active{color:var(--brand)}
  .tab-item span{line-height:1}
}
.more-row{display:flex;align-items:center;gap:12px;padding:13px 4px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;font-size:.92rem;font-family:inherit}
.more-row:last-child{border-bottom:0}
.more-row:hover{color:var(--brand)}
.notif-row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s}
.notif-row:last-child{margin-bottom:0}
.notif-row:not(.read){border-color:var(--brand)}
.notif-row.read{opacity:.6}
.notif-row:hover{background:var(--surface-2);border-color:var(--brand)}
.bell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;display:grid;place-items:center}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:7px;font-size:.64rem;padding:1px 5px;font-weight:700}
.content{padding:30px;flex:1;max-width:1320px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:17px;box-shadow:var(--sh-1)}
.kpi-rich{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--sh-1)}
.kpi-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.kpi-rich .n{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi-rich .l{color:var(--muted);font-size:.8rem;margin-top:2px}
.kpi-rich .trend{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;margin-top:8px;color:var(--muted)}
.kpi-rich .trend.ok{color:var(--ok)} .kpi-rich .trend.bad{color:var(--bad)}
.hero-banner{position:relative;border-radius:var(--r-lg);overflow:hidden;color:#fff;min-height:230px;display:flex;align-items:flex-end;box-shadow:var(--sh-2)}
.hero-banner .scene-bg{position:absolute;inset:0;z-index:0}
.hero-banner .scene-bg svg{width:100%;height:100%;object-fit:cover}
.hero-banner .scene-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(6,15,12,.86) 10%, rgba(6,15,12,.35) 55%, rgba(6,15,12,.1) 100%)}
.hero-banner .content{position:relative;z-index:1;padding:26px 28px;width:100%}
.hero-banner h1{color:#fff;font-size:clamp(1.5rem,3vw,2.1rem);max-width:16ch;margin:4px 0 6px}
.hero-banner .wave{font-size:1.3rem}
.hero-pills{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero-pills a{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;padding:9px 16px;border-radius:999px;text-decoration:none;font-size:.85rem;font-weight:600;border:1px solid rgba(255,255,255,.25)}
.hero-pills a:hover{background:rgba(255,255,255,.26)}
.profile-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;box-shadow:var(--sh-1)}
.profile-card .status-badge{display:inline-flex;align-items:center;gap:5px;background:var(--ok-soft);color:var(--ok);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:4px}
.paid-card{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border-radius:12px;padding:12px;margin-top:14px}
.paid-card .ic{width:32px;height:32px;border-radius:9px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--brand)}
.list-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit}
.list-item:last-child{border-bottom:0}
.list-item .ic-bubble{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.list-item .body{flex:1;min-width:0}
.list-item .chev{color:var(--muted);flex:none}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.quick-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;text-decoration:none;color:inherit;display:block;box-shadow:var(--sh-1);transition:box-shadow .15s,transform .15s}
.quick-card:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.quick-card .ic-bubble{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.quick-card b{display:block;font-size:.92rem}
.quick-card .desc{color:var(--muted);font-size:.78rem;display:block;margin-top:2px}
.promo-banner{position:relative;border-radius:var(--r-card);overflow:hidden;color:#fff;min-height:150px;display:flex;align-items:flex-end}
.promo-banner .scene-bg{position:absolute;inset:0}
.promo-banner .scene-bg svg{width:100%;height:100%;object-fit:cover}
.promo-banner .scene-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg, rgba(10,33,56,.92), rgba(10,33,56,.45))}
.promo-banner .content{position:relative;z-index:1;padding:18px 20px}
.promo-banner h4{color:#fff;font-size:1.05rem;margin-bottom:4px}
.promo-banner p{font-size:.8rem;opacity:.85;margin-bottom:12px}
.sidebar-badge{margin-left:auto;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;flex:none}
.side-foot{padding:12px 10px 4px;font-size:.7rem;color:var(--nav-text);opacity:.55;display:flex;align-items:center;gap:6px}
.ai-search{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand-soft), var(--sh-1)}
.ai-fab{position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:0;box-shadow:var(--sh-3);display:grid;place-items:center;cursor:pointer;z-index:55;transition:transform .15s}
.ai-fab:hover{transform:scale(1.06)}
@media (max-width:760px){.ai-fab{bottom:calc(78px + env(safe-area-inset-bottom));right:16px;width:50px;height:50px}}
.ai-chat{display:flex;flex-direction:column;height:min(60vh,480px)}
.ai-chat-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.ai-chat-input{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.mic-btn{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,color .15s}
.mic-btn:hover{background:var(--surface-3)}
.mic-btn.listening{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(169,57,46,.4)}50%{box-shadow:0 0 0 8px rgba(169,57,46,0)}}
.kpi .n{font-size:1.8rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-family:var(--sans)}
.kpi .l{color:var(--muted);font-size:.8rem;margin-top:3px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h2{font-size:clamp(1.5rem,2.4vw,1.95rem)}
.two-col{display:grid;grid-template-columns:1.62fr 1fr;gap:18px;align-items:start}
.timeline{display:flex;flex-direction:column;gap:15px}
.timeline .it{display:flex;gap:11px;font-size:.86rem}
.timeline .it i{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none;box-shadow:0 0 0 3px var(--brand-soft)}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.chat{display:grid;grid-template-columns:280px 1fr;min-height:62vh;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1)}
.threads{border-right:1px solid var(--line);overflow:auto;background:var(--surface-2)}
.thread{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.thread:hover{background:var(--surface-3)}
.thread.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--brand)}
.msgs{display:flex;flex-direction:column}
.msgs .list{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:52vh}
.bubble{max-width:72%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--surface-2);font-size:.88rem}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 4px 14px}
.bubble.me .small{color:rgba(255,255,255,.75)}
.composer{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line);background:var(--surface)}
.chat-back{display:none;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px;flex:none}
.map-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;align-items:start}
.senegal-map{width:100%;max-width:320px;display:block;margin:0 auto}
.map-pin{transition:opacity .15s}
.map-pin:hover circle:nth-child(2){stroke:var(--gold);stroke-width:1}
.map-svg-wrap{background:var(--surface-2);border-radius:var(--r-card);padding:14px}
.map-side{min-height:180px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;align-items:end}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 15px;border-radius:9px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:.84rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .35s ease}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:14px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(100deg,var(--surface-2) 20%,var(--surface-3) 42%,var(--surface-2) 64%);background-size:250% 100%;animation:shimmer 1.3s ease infinite}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-20% 0}}
@media (prefers-reduced-motion: reduce){.skeleton{animation:none;background:var(--surface-2)}}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:10px;border-radius:var(--r-card);overflow:hidden}
.gallery .photo:first-child{grid-row:span 2;aspect-ratio:16/11}
.gallery .photo{aspect-ratio:16/10}

/* ---------- Responsive ---------- */
@media (max-width:1080px){.two-col{grid-template-columns:1fr}}
@media (max-width:980px){
  #detail-grid{grid-template-columns:1fr !important}
  .hero-grid,.form-grid{grid-template-columns:1fr}
  .hero{padding:48px 0}
  .stat-band{grid-template-columns:1fr 1fr;gap:20px}
  .searchbar{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .burger{display:none}
  .content,.topbar{padding:16px}
  .content{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .chat{grid-template-columns:1fr;min-height:0}
  .threads{max-height:none}
  .chat-back{display:inline-flex}
  .chat:not(.thread-open) .msgs{display:none}
  .chat.thread-open .threads{display:none}
  .msgs .list{max-height:none;flex:1}
  .msgs{height:calc(100dvh - 260px)}
  .searchbar{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
  .gallery .photo:first-child{grid-row:auto}
  .map-layout{grid-template-columns:1fr}
  .compare-bar{bottom:calc(84px + env(safe-area-inset-bottom))}
  .section{padding:48px 0}
}
</style>

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();
const money = n => Number(n).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g, ' ') + ' FCFA';
const dateFr = d => d ? new Date(d).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const dateTimeFr = d => d ? new Date(d).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const daysBetween = (a, b) => Math.ceil((new Date(b) - new Date(a)) / 86400000);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString(); };
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const initials = u => ((u.firstName || u.agencyName || '?')[0] + (u.lastName || u.firstName || '?')[0]).toUpperCase();
const avatarColor = id => `hsl(${hash(id) % 360} 45% 38%)`;
const telHref = phone => 'tel:' + String(phone || '').replace(/[^\d+]/g, '');
function avatarHtml(u, size = 36) {
  if (u && u.avatarPhoto) return `<img src="${u.avatarPhoto}" alt="" style="width:${size}px;height:${size}px;border-radius:${Math.round(size * .3)}px;object-fit:cover;flex:none">`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.max(.6, size * .026)}rem;background:${avatarColor((u && u.id) || 'x')}">${initials(u || {})}</div>`;
}

   MODULE : storage.js — couche d'accès unique au localStorage
   Remplacer ces 6 méthodes par des appels API suffit pour passer en production.
   ========================================================================== */
const DB = {
  K: {
    users:'deuksil_users', properties:'deuksil_properties', favorites:'deuksil_favorites',
    visits:'deuksil_visits', messages:'deuksil_messages', notifications:'deuksil_notifications',
    payments:'deuksil_payments', subscriptions:'deuksil_subscriptions', agents:'deuksil_agents',
    searches:'deuksil_searches', activity:'deuksil_activity', documents:'deuksil_documents', session:'deuksil_current_user',
    seed:'deuksil_seed_version'
  },
  getData(k)      { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } },
  setData(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)); this.lastWriteOk = true; } catch (e) { toast('Stockage local saturé : réduisez le nombre ou le poids des fichiers.', 'bad'); this.lastWriteOk = false; } return this.lastWriteOk; },
  addItem(k, item){
    const list = this.getData(k);
    item.id = item.id || uid(k.replace('deuksil_', '').replace(/s$/, ''));
    item.createdAt = item.createdAt || now(); item.updatedAt = now();
    list.push(item); this.setData(k, list); return item;
  },
  updateItem(k, id, patch) {
    const list = this.getData(k), i = list.findIndex(x => x.id === id);
    if (i < 0) return null;
    list[i] = {...list[i], ...patch, updatedAt: now()};
    this.setData(k, list); return list[i];
  },
  deleteItem(k, id) { this.setData(k, this.getData(k).filter(x => x.id !== id)); },
  findItem(k, fn)   { return this.getData(k).find(typeof fn === 'function' ? fn : x => x.id === fn) || null; },
  filterItems(k, fn){ return this.getData(k).filter(fn); },
  reset() { Object.values(this.K).forEach(k => localStorage.removeItem(k)); }
};

/* Nettoyage en cascade : ce que les messages de confirmation promettent doit être réellement fait. */
function cascadeDeleteProperty(propertyId) {
  DB.getData(DB.K.favorites).filter(f => f.propertyId === propertyId).forEach(f => DB.deleteItem(DB.K.favorites, f.id));
  DB.getData(DB.K.visits).filter(v => v.propertyId === propertyId).forEach(v => DB.deleteItem(DB.K.visits, v.id));
  DB.deleteItem(DB.K.properties, propertyId);
}
function cascadeDeleteUser(userId) {
  DB.filterItems(DB.K.properties, p => p.ownerId === userId).forEach(p => cascadeDeleteProperty(p.id));
  DB.getData(DB.K.messages).filter(t => t.participants.includes(userId)).forEach(t => DB.deleteItem(DB.K.messages, t.id));
  DB.getData(DB.K.favorites).filter(f => f.userId === userId).forEach(f => DB.deleteItem(DB.K.favorites, f.id));
  DB.getData(DB.K.visits).filter(v => v.clientId === userId || v.ownerId === userId).forEach(v => DB.deleteItem(DB.K.visits, v.id));
  DB.getData(DB.K.notifications).filter(n => n.userId === userId).forEach(n => DB.deleteItem(DB.K.notifications, n.id));
  DB.getData(DB.K.searches).filter(s => s.userId === userId).forEach(s => DB.deleteItem(DB.K.searches, s.id));
  DB.getData(DB.K.subscriptions).filter(s => s.userId === userId).forEach(s => DB.deleteItem(DB.K.subscriptions, s.id));
  DB.getData(DB.K.documents).filter(d => d.ownerId === userId).forEach(d => DB.deleteItem(DB.K.documents, d.id));
  DB.getData(DB.K.agents).filter(a => a.agencyId === userId).forEach(a => DB.deleteItem(DB.K.agents, a.id));
  DB.deleteItem(DB.K.users, userId);
}

let audioCtx = null;
function soundEnabled() { return localStorage.getItem('deuksil_sound_pref') !== 'off'; }
function playNotifySound() {
  if (!soundEnabled()) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [[880, 0, .12, .16], [1318.5, .1, .18, .14]].forEach(([freq, delay, dur, peak]) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const start = t0 + delay;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, start + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + dur + .03);
    });
  } catch (e) { /* Web Audio indisponible dans ce navigateur : on ignore silencieusement */ }
}
let lastUnreadCount = {};
function checkNotifySound(u) {
  if (!u) return;
  const count = DB.filterItems(DB.K.notifications, n => n.userId === u.id && !n.read).length;
  if (lastUnreadCount[u.id] !== undefined && count > lastUnreadCount[u.id]) {
    playNotifySound();
    if (window.Notification && Notification.permission === 'granted') {
      try {
        const latest = DB.filterItems(DB.K.notifications, n => n.userId === u.id).slice(-1)[0];
        new Notification('DEUKSIL', {body: latest ? latest.text : 'Nouvelle notification', silent: true});
      } catch (e) { /* API Notification indisponible dans ce contexte : on ignore */ }
    }
  }
  lastUnreadCount[u.id] = count;
}

  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3200);

let modalLastFocus = null;
function modal(title, bodyHtml, opts = {}) {
  closeModal();
  modalLastFocus = document.activeElement;
  const titleId = 'modal-title-' + uid('t');
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
    <div class="modal-head"><h3 id="${titleId}">${esc(title)}</h3>${opts.noClose ? '' : `<button class="x" data-action="close-modal" aria-label="Fermer cette fenêtre">${icon('close', 18)}</button>`}</div>
    <div class="modal-body">${bodyHtml}</div></div>`;
  if (!opts.noClose) back.addEventListener('click', e => { if (e.target === back) closeModal(); });
  $('#modal-root').appendChild(back);
  const dialog = back.querySelector('.modal');
  const focusables = () => [...dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];
  back.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !opts.noClose) { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab') {
      const f = focusables(); if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  const toFocus = focusables()[0] || dialog;
  setTimeout(() => toFocus.focus(), 20);
  return back;
}
function closeModal() {
  $('#modal-root').innerHTML = '';
  if (modalLastFocus && document.contains(modalLastFocus)) modalLastFocus.focus();
  modalLastFocus = null;
}

/* ==========================================================================
   MODULE : paydunya.js — simulation fidèle du flux PayDunya (agrégateur)
   Structure des réponses alignée sur l'API réelle de PayDunya (documentation
   publique developers.paydunya.com) : /checkout-invoice/create puis
   /checkout-invoice/confirm/{token}. AUCUN appel réseau réel, AUCUNE clé —
   une intégration réelle nécessite un backend (les clés PAYDUNYA-* ne
   doivent jamais vivre côté navigateur). Voir le README, section Paiements.
   ========================================================================== */
const PAYDUNYA_METHODS = [
  {key: 'orange_money', label: 'Orange Money', hint: 'Code de confirmation envoyé par SMS', field: 'phone'},
  {key: 'wave',         label: 'Wave',          hint: 'Paiement mobile instantané',          field: 'phone'},
  {key: 'free_money',   label: 'Free Money',    hint: 'Paiement mobile Free',                 field: 'phone'},
  {key: 'card',         label: 'Carte bancaire',hint: 'Visa, Mastercard',                     field: 'card'}
];
function randToken(n) { const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let s = ''; for (let i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
function randHex(n) { let s = ''; for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 16).toString(16); return s; }

const Pay = {
  open({title, amount, type, userId, onSuccess}) {
    const user = DB.findItem(DB.K.users, userId) || {};
    const token = 'test_' + randToken(10);
    const invoiceUrl = `https://app.paydunya.com/sandbox-checkout/invoice/${token}`;

    modal('PayDunya', `
      <div class="pd-topbar"><b>PayDunya</b><span class="badge">Bac à sable — simulation</span></div>
      <div class="spinner"></div>
      <p class="small muted" style="text-align:center">Création de la facture…</p>`, {noClose: true});

    setTimeout(() => renderCheckout(), 550);

    function renderCheckout(selected) {
      const m = selected || PAYDUNYA_METHODS[0].key;
      modal('PayDunya', `
        <div class="pd-topbar"><b>PayDunya</b><span class="badge ok">Bac à sable — simulation</span></div>
        <div class="pd-merchant">
          <div class="row-between"><span class="small muted">Marchand</span><b class="small">DEUKSIL</b></div>
          <div class="row-between"><span class="small muted">Description</span><span class="small">${esc(title)}</span></div>

        </div>
        <p class="small muted" style="margin:14px 0 8px">Choisissez un moyen de paiement</p>
        <div class="pd-methods">
          ${PAYDUNYA_METHODS.map(x => `<button type="button" class="pd-method ${x.key === m ? 'on' : ''}" data-action="pd-select" data-m="${x.key}">
            <b class="small">${x.label}</b><span class="small muted">${x.hint}</span></button>`).join('')}
        </div>
        ${PAYDUNYA_METHODS.find(x => x.key === m).field === 'card' ? `
          <div class="form-grid" style="margin-top:14px">
            <div class="field" style="grid-column:1/-1"><label>Numéro de carte</label><input class="input" id="pd-card" placeholder="4242 4242 4242 4242" maxlength="19"></div>

        <p class="small muted" style="text-align:center;margin-top:10px">Simulation à but pédagogique — aucune donnée bancaire n'est transmise.</p>
        <div id="pd-state" style="margin-top:10px"></div>`, {noClose: true});

      $$('[data-action="pd-select"]').forEach(btn => btn.onclick = () => renderCheckout(btn.dataset.m));
      $('[data-action="pd-pay"]').onclick = () => runPayment(m);
    }

    function runPayment(methodKey) {
      const method = PAYDUNYA_METHODS.find(x => x.key === methodKey);
      const box = $('#pd-state');
      $('[data-action="pd-pay"]').disabled = true;
      $$('.pd-method').forEach(b => b.disabled = true);

      let p = 0;
      const steps = ['Vérification des informations…', 'Envoi de la demande de paiement…', 'Confirmation auprès de PayDunya…'];
      const iv = setInterval(() => {
        p += 34; const bar = box.querySelector('.progress i'); if (bar) bar.style.width = Math.min(p, 100) + '%';
        const stepText = box.querySelector('p'); if (stepText) stepText.textContent = steps[Math.min(2, Math.floor(p / 34))];
        if (p >= 100) {
          clearInterval(iv);
          const hash = randHex(64);
          const paydunya = {
            token, response_code: '00', status: 'completed', hash,
            customer: {name: displayName(user), phone: user.phone || ''},

              <div class="small muted">Statut : completed · Hash ${hash.slice(0, 12)}…</div>
              <div class="small muted">${method.label} · ${money(amount)}</div></div></div></div>`;
          setTimeout(() => { closeModal(); onSuccess(tx); }, 1100);
        }
      }, 480);
    }

};

function kpi(n, l, tone) { return `<div class="kpi"><div class="n" ${tone ? `style="color:var(--${tone})"` : ''}>${n}</div><div class="l">${esc(l)}</div></div>`; }
function dailyBuckets(records, days = 7) {
  const labels = [], counts = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    labels.push(d.toLocaleDateString('fr-FR', {weekday: 'short'}).replace('.', ''));
    counts.push(records.filter(r => (r.createdAt || '').slice(0, 10) === key).length);
  }
  return {labels, counts};
}
function periodTrend(records, days = 7) {
  const cutoff1 = addDays(now(), -days), cutoff2 = addDays(now(), -days * 2);
  const recent = records.filter(r => r.createdAt >= cutoff1).length;
  const prior = records.filter(r => r.createdAt >= cutoff2 && r.createdAt < cutoff1).length;
  if (prior === 0) return recent > 0 ? {label: `+${recent} cette semaine`, tone: 'ok'} : null;
  const pct = Math.round(((recent - prior) / prior) * 100);
  if (pct === 0) return {label: 'Stable cette semaine', tone: ''};
  return {label: `${pct > 0 ? '+' : ''}${pct}% cette semaine`, tone: pct > 0 ? 'ok' : 'bad'};
}

  return `<div class="kpi-rich">
    <div class="kpi-icon" style="background:var(--${tone}-soft);color:var(--${tone})">${icon(iconName, 19)}</div>
    <div class="n">${n}</div><div class="l">${esc(l)}</div>
    ${trend ? `<div class="trend ${trend.tone}">${trend.tone === 'ok' ? icon('trendUp', 11) : ''}${esc(trend.label)}</div>` : ''}

}

function barChart(data, {height = 190, color = 'var(--brand)', money: isMoney} = {}) {
  const max = Math.max(1, ...data.map(d => d[1]));
  const w = 100 / data.length;
  return `<svg viewBox="0 0 100 ${height / 3}" preserveAspectRatio="none" style="width:100%;height:${height}px;overflow:visible">

    }).join('')}
  </svg>`;
}
function lineChart(data, {height = 190} = {}) {
  const max = Math.max(1, ...data.map(d => d[1])), H = height / 3 - 10;
  const pts = data.map((d, i) => [i * (100 / (data.length - 1 || 1)), H - (d[1] / max) * (H - 4) + 2]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 100 ${height / 3}" preserveAspectRatio="none" style="width:100%;height:${height}px;overflow:visible">
    <path d="${path} L100 ${H} L0 ${H} Z" fill="var(--brand)" opacity=".10"/>
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="1" fill="var(--brand)"><title>${esc(data[i][0])} : ${data[i][1]}</title></circle>`).join('')}
    ${data.map((d, i) => `<text x="${pts[i][0]}" y="${H + 6}" font-size="2.6" text-anchor="middle" fill="currentColor" opacity=".6">${esc(d[0])}</text>`).join('')}
  </svg>`;
}
function dualLineChart(labels, seriesA, seriesB, {height = 190, colorA = 'var(--brand)', colorB = 'var(--gold)'} = {}) {
  const max = Math.max(1, ...seriesA, ...seriesB), H = height / 3 - 10;
  const x = i => i * (100 / (labels.length - 1 || 1));
  const line = (vals, color) => {
    const pts = vals.map((v, i) => [x(i), H - (v / max) * (H - 4) + 2]);
    const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    return {path, pts};
  };
  const a = line(seriesA, colorA), b = line(seriesB, colorB);
  return `<svg viewBox="0 0 100 ${height / 3}" preserveAspectRatio="none" style="width:100%;height:${height}px;overflow:visible">
    <path d="${a.path} L100 ${H} L0 ${H} Z" fill="${colorA}" opacity=".08"/>
    <path d="${a.path}" fill="none" stroke="${colorA}" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${b.path}" fill="none" stroke="${colorB}" stroke-width="1" vector-effect="non-scaling-stroke"/>
    ${a.pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r=".9" fill="${colorA}"><title>${esc(labels[i])} : ${seriesA[i]}</title></circle>`).join('')}
    ${b.pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r=".9" fill="${colorB}"><title>${esc(labels[i])} : ${seriesB[i]}</title></circle>`).join('')}
    ${labels.map((l, i) => `<text x="${x(i)}" y="${H + 6}" font-size="2.6" text-anchor="middle" fill="currentColor" opacity=".6">${esc(l)}</text>`).join('')}
  </svg>`;
}
function donutList(data) {

/* ==========================================================================
   MODULE : ai.js — assistant de recherche
   Utilise la vraie IA (capacité "sample") quand elle est disponible ; sinon
   bascule sur un analyseur local en français (aucun réseau, fonctionne
   toujours depuis le lien publié). Le rendu du résultat ne change pas :
   seule la façon d'interpréter la phrase diffère.
   ========================================================================== */
let aiSample = null;
let aiSearchAvailable = false;
async function initAi() {
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  try {
    const ns = await window.claude.use('sample');
    if (!ns) return;
    aiSample = ns;
    aiSearchAvailable = true;
  } catch (e) { /* capacité indisponible pour cette personne : on reste sur l'analyseur local */ }
}
function sanitizeAiFilters(raw) {
  const out = {};
  if (['location', 'vente', 'terrain'].includes(raw.transaction)) out.transaction = raw.transaction;
  if (raw.region && LOCATIONS[raw.region]) {
    out.region = raw.region;
    if (raw.city && LOCATIONS[raw.region][raw.city]) {
      out.city = raw.city;
      if (raw.quartier && LOCATIONS[raw.region][raw.city].includes(raw.quartier)) out.quartier = raw.quartier;
    }
  }
  if (PROPERTY_TYPES.includes(raw.type)) out.type = raw.type;
  if (Number.isFinite(raw.min) && raw.min >= 0) out.min = String(Math.round(raw.min));
  if (Number.isFinite(raw.max) && raw.max >= 0) out.max = String(Math.round(raw.max));
  if (Number.isFinite(raw.rooms) && raw.rooms >= 0) out.rooms = String(Math.round(raw.rooms));
  if (raw.furnished === true) out.furnished = true;
  if (raw.parking === true) out.parking = true;
  return out;
}

/* --- Analyseur local (sans IA) : reconnaît ville/quartier, type, budget, meublé --- */
function parseSearchLocal(query) {
  const q = ' ' + query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') + ' ';
  const out = {};
  if (/\b(louer|location|a louer|locatif)\b/.test(q)) out.transaction = 'location';
  else if (/\b(vendre|vente|a vendre|acheter)\b/.test(q)) out.transaction = 'vente';
  else if (/\bterrain\b/.test(q)) out.transaction = 'terrain';

  for (const t of PROPERTY_TYPES) { if (q.includes(' ' + t + ' ') || q.includes(' ' + t + 's ')) { out.type = t; break; } }

  outer:
  for (const region of Object.keys(LOCATIONS)) {
    for (const city of Object.keys(LOCATIONS[region])) {
      for (const quartier of LOCATIONS[region][city]) {
        if (q.includes(' ' + quartier.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') + ' ')) {
          out.region = region; out.city = city; out.quartier = quartier; break outer;
        }
      }
      if (q.includes(' ' + city.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') + ' ')) { out.region = region; out.city = city; break outer; }
    }
    if (q.includes(' ' + region.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') + ' ')) { out.region = region; break outer; }
  }

  if (/\bmeuble/.test(q) && !/\bnon meuble/.test(q)) out.furnished = true;
  if (/\bparking\b/.test(q)) out.parking = true;

  const roomsM = q.match(/(\d+)\s*(chambres?|pieces?)/);
  if (roomsM) out.rooms = +roomsM[1];

  const numTokens = [...q.matchAll(/(\d[\d\s]{2,})(k|000)?\s*(fcfa|cfa|f)?/g)]
    .map(m => { let n = parseInt(m[1].replace(/\s/g, ''), 10); if (m[2] === 'k') n *= 1000; return n; })
    .filter(n => n >= 1000);
  const between = q.match(/entre\s+(\d[\d\s]*)\s*(?:et|-)\s+(\d[\d\s]*)/);
  if (between) { out.min = parseInt(between[1].replace(/\s/g, ''), 10); out.max = parseInt(between[2].replace(/\s/g, ''), 10); }
  else if (/(moins de|maximum|max|jusqu.a|sous)\s/.test(q) && numTokens.length) out.max = numTokens[0];
  else if (/(a partir de|minimum|min|plus de|au moins)\s/.test(q) && numTokens.length) out.min = numTokens[0];
  else if (numTokens.length === 1) out.max = numTokens[0];
  else if (numTokens.length >= 2) { out.min = Math.min(...numTokens); out.max = Math.max(...numTokens); }

  return out;
}
function describeFilters(f) {
  const parts = [];
  if (f.transaction) parts.push(TRANSACTION_LABEL[f.transaction].toLowerCase());
  if (f.type) parts.push(f.type);
  if (f.quartier) parts.push('à ' + f.quartier);
  else if (f.city) parts.push('à ' + f.city);
  else if (f.region) parts.push('en région ' + f.region);
  if (f.min && f.max) parts.push(`entre ${money(f.min)} et ${money(f.max)}`);
  else if (f.max) parts.push('jusqu\'à ' + money(f.max));
  else if (f.min) parts.push('à partir de ' + money(f.min));
  if (f.rooms) parts.push(f.rooms + ' chambres minimum');
  if (f.furnished) parts.push('meublé');
  if (f.parking) parts.push('avec parking');
  return parts.length ? `Voici ce que j'ai compris : ${parts.join(', ')}.` : "Je n'ai pas trouvé de critère précis dans votre phrase ; affinez avec les filtres ci-dessous.";
}
async function runAiSearch(query, box) {
  if (!query || !query.trim()) return;
  let filters, message;
  if (aiSample) {
    const prompt = `Tu es l'assistant de recherche du site immobilier DEUKSIL au Sénégal.
Réponds UNIQUEMENT avec un objet JSON strict (pas de texte autour, pas de balises markdown), avec exactement ces clés :
{"transaction":"location|vente|terrain ou vide","region":"...","city":"...","quartier":"...","type":"...","min":nombre ou null,"max":nombre ou null,"rooms":nombre ou null,"furnished":true|false,"parking":true|false,"message":"une phrase amicale en français, courte, confirmant ce que tu as compris"}
Règles strictes :
- "region" doit être exactement l'une de ces valeurs, sinon laisse "" : ${Object.keys(LOCATIONS).join(', ')}.
- "city" doit être une ville qui existe réellement dans cette région : ${JSON.stringify(LOCATIONS)}.
- "type" doit être exactement l'une de ces valeurs, sinon laisse "" : ${PROPERTY_TYPES.join(', ')}.
- Les prix sont en francs CFA. Ne déduis jamais un champ que la phrase ne permet pas clairement de déterminer : laisse-le vide/null plutôt que de deviner.
Demande du client, en français : "${query.trim()}"`;
    try {
      const result = await aiSample.json(prompt, {modelTier: 'quick'});
      filters = sanitizeAiFilters(result || {});
      message = result && result.message ? result.message : describeFilters(filters);
    } catch (e) {
      filters = sanitizeAiFilters(parseSearchLocal(query));
      message = describeFilters(filters);
    }
  } else {
    filters = sanitizeAiFilters(parseSearchLocal(query));
    message = describeFilters(filters);
  }
  searchState = {...searchState, region: '', city: '', quartier: '', type: '', min: '', max: '', rooms: '', furnished: false, parking: false, ...filters, page: 1};
  searchView = 'list';
  render();
  toast(message);
}

function localAssistantReply(text) {

    return {reply: "Depuis la fiche d'un bien, cliquez sur « Demander une visite », choisissez une date et une heure. Le propriétaire accepte, refuse ou reporte, et vous êtes notifié."};

async function sendAiChat(text) {
  const msg = (text || '').trim();
  if (!msg || aiChatBusy) return;
  if (!aiSample) {
    const r = localAssistantReply(msg);
    aiChatHistory.push({role: 'user', content: msg});
    aiChatHistory.push({role: 'assistant', content: r.reply});
    renderAiChatInPlace();
    if (r.filters) {
      searchState = {...searchState, region: '', city: '', quartier: '', type: '', min: '', max: '', rooms: '', furnished: false, parking: false, ...r.filters, page: 1};
      searchView = 'list';
      setTimeout(() => { closeModal(); go('#/search'); }, 900);
    }
    return;
  }
  aiChatBusy = true;
  aiChatHistory.push({role: 'user', content: msg});
  aiChatHistory.push({role: 'assistant', content: ''});
  renderAiChatInPlace();
  const turns = [{role: 'user', content: aiChatRules()}, ...aiChatHistory.slice(0, -1)];
  try {
    const res = await aiSample(turns, {cache: false, onText: ({text}) => { aiChatHistory[aiChatHistory.length - 1].content = text; renderAiChatInPlace(); }});
    aiChatHistory[aiChatHistory.length - 1].content = res.text;
  } catch (e) {
    aiChatHistory[aiChatHistory.length - 1].content = aiErrorMessage(e);
  }
  aiChatBusy = false;
  renderAiChatInPlace();
}

function startVoiceInput(inputEl, micBtn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("La dictée vocale n'est pas prise en charge par ce navigateur.", 'warn'); return; }
  try {
    const rec = new SR();
    rec.lang = 'fr-FR'; rec.interimResults = false; rec.maxAlternatives = 1;
    micBtn.classList.add('listening');
    rec.onresult = e => { if (inputEl) inputEl.value = e.results[0][0].transcript; };

    rec.onend = () => micBtn.classList.remove('listening');

}

function isDarkTheme() {
  const t = document.documentElement.dataset.theme;
  if (t === 'dark') return true;
  if (t === 'light') return false;

}
function ownerSubscriptionActive(ownerId) {
  const owner = DB.findItem(DB.K.users, ownerId);

}

let searchState = {transaction:'', region:'', city:'', quartier:'', type:'', min:'', max:'', rooms:'', baths:'', surface:'', furnished:false, parking:false, sort:'recent', page:1};
const PAGE_SIZE = 9;
const SORT_LABEL = {recent:'Plus récents', priceAsc:'Prix croissant', priceDesc:'Prix décroissant', viewsDesc:'Les plus vus', surfaceDesc:'Plus grande surface'};

function applySearch() {
  const s = searchState;
  const list = published().filter(p =>
    (!s.transaction || p.transaction === s.transaction) &&
    (!s.region || p.region === s.region) && (!s.city || p.city === s.city) && (!s.quartier || p.quartier === s.quartier) &&
    (!s.type || p.type === s.type) &&
    (!s.min || p.price >= +s.min) && (!s.max || p.price <= +s.max) &&
    (!s.rooms || p.rooms >= +s.rooms) && (!s.baths || p.baths >= +s.baths) && (!s.surface || p.surface >= +s.surface) &&
    (!s.furnished || p.furnished) && (!s.parking || p.parking) &&
    p.status !== 'loue' && p.status !== 'vendu'
  );
  const sorters = {
    recent: (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
    priceAsc: (a, b) => a.price - b.price,
    priceDesc: (a, b) => b.price - a.price,
    viewsDesc: (a, b) => (b.views || 0) - (a.views || 0),
    surfaceDesc: (a, b) => b.surface - a.surface
  };
  return list.sort(sorters[s.sort] || sorters.recent);
}

  if (s.surface) chips.push(['surface', 'à partir de ' + s.surface + ' m²']);

  if (s.parking) chips.push(['parking', 'Parking']);
  return chips;
}

    ${chips.map(([k, l]) => `<span class="chip">${esc(l)}<button data-action="clear-chip" data-k="${k}" aria-label="Retirer ce filtre">${icon('close', 12)}</button></span>`).join('')}

  if (!res.length) return chipsHtml + `<div class="empty"><b>Aucun bien ne correspond</b><p class="small">Élargissez le budget ou retirez un filtre pour voir plus d'annonces.</p></div>`;

  const pages = Math.max(1, Math.ceil(res.length / PAGE_SIZE));
  const page = Math.min(Math.max(1, searchState.page || 1), pages);
  const pageItems = res.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  return chipsHtml + `
    <div class="row-between" style="margin-bottom:14px">

          ${Object.entries(SORT_LABEL).map(([k, l]) => `<option value="${k}" ${searchState.sort === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        ${u && u.role === 'client' ? `<button class="btn ghost sm" data-action="save-search">Enregistrer cette recherche</button>` : ''}
      </div>
    </div>
    <div class="props">${pageItems.map(p => propertyCard(p, favIds, true)).join('')}</div>
    ${pages > 1 ? `<div class="row" style="justify-content:center;gap:6px;margin-top:26px">
      <button class="btn ghost sm" data-action="go-page" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>${icon('arrowLeft', 14)} Précédent</button>
      <span class="small muted" style="padding:0 8px">Page ${page} / ${pages}</span>
      <button class="btn ghost sm" data-action="go-page" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Suivant ${icon('arrowRight', 14)}</button>
    </div>` : ''}${compareBarHtml()}`;
}

/* --- Photos du bien : compression côté navigateur, stockage en base64 dans le bien --- */
const MAX_PHOTOS = 8, MAX_PHOTO_DIM = 1280, PHOTO_QUALITY = .72;
let formPhotos = [], formPhotosFor = null;
function resetFormPhotosIfNeeded(pid, existing) {
  if (formPhotosFor !== pid) { formPhotos = (existing || []).slice(); formPhotosFor = pid; }
}
function readImageAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('lecture impossible'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image invalide'));
      img.onload = () => {
        const scale = Math.min(1, MAX_PHOTO_DIM / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* --- Documents (pièces jointes libres : identité, titres fonciers, etc.) --- */
const MAX_DOC_SIZE = 4 * 1024 * 1024;
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (file.size > MAX_DOC_SIZE) return reject(new Error('fichier trop volumineux'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('lecture impossible'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
function docIcon(mime) { return mime && mime.startsWith('image/') ? 'image' : 'file'; }
