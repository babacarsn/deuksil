# =============================================================================
# DEUKSIL — configuration Supabase CLI (développement local et référence des
# réglages du projet hébergé). Aucun secret ici : les valeurs sensibles sont lues
# depuis l'environnement (env(...)) — voir .env.example.
#   supabase start            # pile locale (Docker) avec ces réglages
#   supabase db reset         # rejoue supabase/migrations sur la base locale
#   supabase db push          # applique les migrations au projet lié
#   supabase functions deploy gerer-acces
# Les réglages [auth] ci-dessous s'appliquent au local ; sur le projet hébergé,
# les reporter dans le tableau de bord (README_SUPABASE.md §3) ou via
# « supabase config push » si votre version de la CLI le propose.
# =============================================================================
project_id = "deuksil"

[api]
enabled = true
port = 54321
# Seul le schéma public est exposé ; le schéma privé « app » ne l'est jamais.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Taille maximale d'une page de résultats (l'application lit par pages de 1000).
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
# Aucune donnée de démonstration n'est chargée automatiquement.
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Limite globale ; chaque compartiment a la sienne (migration 0600).
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = ["http://127.0.0.1:54321/**", "http://localhost:54321/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "Confirmez votre adresse DEUKSIL"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Votre code DEUKSIL"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"

# Le jeton de l'appelant est vérifié par la plateforme, puis à nouveau par la fonction.
[functions.gerer-acces]
verify_jwt = true
